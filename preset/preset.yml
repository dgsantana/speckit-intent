schema_version: "1.0"

preset:
  id: "intent"
  name: "Intent"
  version: "0.1.0"
  description: "Outcome-first specs: each outcome carries its check; plan and tasks stay small; extra artifacts only when they earn their place"
  author: "Daniel Santana"
  repository: "https://github.com/dgsantana/speckit-intent"
  license: "MIT"

requires:
  speckit_version: ">=1.1.1"

provides:
  templates:
    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      description: "Intent spec: goal, outcomes with checks, constraints, edge cases, evidence, results"
      replaces: "spec-template"

    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      description: "Short plan: approach, files, hard-to-reverse choices, risks"
      replaces: "plan-template"

    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      description: "Checklist tasks labelled by the outcome they serve"
      replaces: "tasks-template"

    - type: "template"
      name: "decision-template"
      file: "templates/decision-template.md"
      description: "Lean decision record: intent, decision, rejected alternatives, evidence, revisit trigger"

    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "Write an intent spec: outcomes and how each is checked"
      replaces: "speckit.specify"

    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Plan the change that reaches the spec's outcomes"
      replaces: "speckit.plan"

    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Break the plan into tasks, each serving named outcomes"
      replaces: "speckit.tasks"

    - type: "command"
      name: "speckit.clarify"
      file: "commands/speckit.clarify.md"
      description: "Ask only where the answer changes an outcome; write answers where they belong"
      replaces: "speckit.clarify"

    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      description: "Read-only check of spec, plan and tasks against each other and the code"
      replaces: "speckit.analyze"

    - type: "command"
      name: "speckit.converge"
      file: "commands/speckit.converge.md"
      description: "Append tasks for outcomes the code does not yet reach"
      replaces: "speckit.converge"

    - type: "command"
      name: "speckit.checklist"
      file: "commands/speckit.checklist.md"
      description: "Reviewer's checklist for one concern, testing whether spec and plan say enough"
      replaces: "speckit.checklist"

tags:
  - "intent"
  - "outcomes"
  - "lean"
  - "workflow"
