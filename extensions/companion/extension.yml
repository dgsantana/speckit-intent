schema_version: "1.0"

extension:
  id: companion
  name: "Visual Companion"
  version: "0.1.0"
  description: "Show mockups, diagrams and visual options in a local browser tab while specifying or planning, and record each choice it settles"
  author: "Daniel Santana"
  repository: https://github.com/dgsantana/speckit-intent
  license: MIT

requires:
  speckit_version: ">=1.1.1"

provides:
  commands:
    - name: speckit.companion.show
      file: commands/speckit.companion.show.md
      description: "Show a visual question in the browser companion and record the choice it settles"
  scripts:
    - name: start-companion
      file: scripts/powershell/start-companion.ps1
      description: "Start the companion server for this project"
      runtimes: [powershell]
    - name: stop-companion
      file: scripts/powershell/stop-companion.ps1
      description: "Stop a companion session"
      runtimes: [powershell]
    - name: start-companion-sh
      file: scripts/bash/start-companion.sh
      description: "Start the companion server for this project (bash)"
      runtimes: [bash]
    - name: stop-companion-sh
      file: scripts/bash/stop-companion.sh
      description: "Stop a companion session (bash)"
      runtimes: [bash]

tags:
  - "design"
  - "visual"
  - "decisions"
